# Project configuration
[project]
name = "WIG20-GARCH"
version = "0.1.0"
requires-python = "==3.11.15"
dependencies = [
    "deap>=1.4.1,<2.0.0",
    "jupyterlab>=4.0.0,<5.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "numpy>=2.0.0,<2.5.0",
    "pandas>=2.2.0,<4.0.0",
    "rpy2>=3.5.1,<=3.5.14",
    "scikit-learn>=1.3.0,<2.0.0",
    "scipy>=1.13.0,<2.0.0",
    "seaborn>=0.13.0,<1.0.0",
    "tqdm>=4.66.0,<5.0.0",
]

# Ruff configuration
[tool.ruff]
target-version = "py311"
line-length = 120

# Include Jupyter Notebooks for Ruff
extend-include = ["*.ipynb"]

# Define which issues to flag
[tool.ruff.lint]
# E: Error, F: Pyflakes, I: Isort, UP: Pyupgrade, B: Bugbear
select = ["E", "F", "I", "UP", "B"]
fixable = ["ALL"]

# Jupyter Notebook specific settings
[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
    # Allow imports not at the top of the file
    "E402",
    # Ignore line length violations (notebooks often have long strings/data)
    "E501",
]

# Force double quotes for Python strings
[tool.ruff.format]
quote-style = "double"

# Mypy configuration
[tool.mypy]
python_version = "3.11"
strict = true

# Explicitly exclude the notebooks directory from type checking
exclude = [
    "^build/",
    '^notebooks/',
]

# Standard stability settings
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "deap.*",
    "rpy2.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.10.0,<2.0.0",
    "pandas-stubs>=2.2.0,<3.0.0",
    "ruff>=0.5.0,<1.0.0",
    "scikit-learn-stubs>=0.0.3,<1.0.0",
    "scipy-stubs>=1.13.0,<2.0.0",
    "types-seaborn>=0.13.0,<1.0.0",
    "types-tqdm>=4.66.0,<5.0.0",
]
